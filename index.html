<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Invite</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('./background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      max-width: 500px;
      width: 100%;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    h2 {
      color: #555;
      font-weight: 500;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 10px 0;
    }

    h3 {
      color: #444;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    ul {
      padding-left: 20px;
      color: #444;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 5px;
      color: #e63946;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #777;
      text-align: center;
    }

    .footer a {
      font-size: 11px;
      font-weight: normal;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>It's My Birthday!</h1>
    <h2>On the 2nd May</h2>

    <img src="https://raw.githubusercontent.com/appbrewery/webdev/main/birthday-cake3.4.jpeg" 
         alt="purple birthday cake with candles" />

    <h3>What to bring:</h3>
    <ul>
      <li>Balloons (I love balloons)</li>
      <li>Cake (I'm really good at eating)</li>
      <li>An appetite (There will be lots of food)</li>
    </ul>

    <h3>This is where you need to go:</h3>
    <a href="https://maps.app.goo.gl/ELLxXyxnB1SnziZe7">Google map link</a>

    <div class="footer">
      <a href="https://www.vecteezy.com/vector-art/1213425-background-with-red-heart-balloons" target="_blank" rel="noopener noreferrer">Background: red heart balloons by Vecteezy</a>
    </div>
  </div>
</body>
</html>
